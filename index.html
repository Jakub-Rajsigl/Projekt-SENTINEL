<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL — Ultra Document Reader & Translator</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tesseract.js pro OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #090d16; 
            color: #f3f4f6; 
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
        }
        .font-heading { font-family: 'Space Grotesk', sans-serif; }
        .glass-panel { 
            background: rgba(15, 23, 42, 0.75); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .glass-panel-glow {
            box-shadow: 0 0 25px -5px rgba(56, 189, 248, 0.15);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.4); }
    </style>
</head>
<body class="p-3 sm:p-6 flex flex-col justify-between">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function App() {
            const [speechEnabled, setSpeechEnabled] = useState(true);
            const [translateToCzech, setTranslateToCzech] = useState(true);
            const [isLoading, setIsLoading] = useState(false);
            const [isReading, setIsReading] = useState(false);
            const [fileName, setFileName] = useState('');
            const [originalText, setOriginalText] = useState('');
            const [translatedText, setTranslatedText] = useState('');
            const [statusText, setStatusText] = useState('Připraven k načtení dokumentu');
            const [isDragging, setIsDragging] = useState(false);

            const fileInputRef = useRef(null);

            const stopSpeech = () => {
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                setIsReading(false);
            };

            const speakText = (text) => {
                if (!speechEnabled || !('speechSynthesis' in window) || !text) return;
                stopSpeech();
                setIsReading(true);

                const sentences = text
                    .split(/(?<=[.!?\n])\s+/)
                    .map(s => s.trim())
                    .filter(s => s.length > 0);

                if (sentences.length === 0) {
                    setIsReading(false);
                    return;
                }

                sentences.forEach((sentence, index) => {
                    const utterance = new SpeechSynthesisUtterance(sentence);
                    utterance.lang = 'cs-CZ';
                    utterance.rate = 1.0;

                    if (index === sentences.length - 1) {
                        utterance.onend = () => setIsReading(false);
                        utterance.onerror = () => setIsReading(false);
                    }

                    window.speechSynthesis.speak(utterance);
                });
            };

            // SPOLEHLIVÝ PŘEKLAD CEZ GOOGLE TRANSLATE API (BEZ LIMITU A VŠECHNY JAZYKY)
            const translateText = async (text) => {
                if (!translateToCzech || text.trim().length === 0) return text;

                setStatusText("Překládám obsah do češtiny...");

                try {
                    // Primární spolehlivé rozhraní Google Translate Engine
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=cs&dt=t&q=${encodeURIComponent(text)}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (data && data[0]) {
                        // Spojení všech přeložených vět dohromady
                        const translated = data[0].map(item => item[0]).filter(Boolean).join('');
                        if (translated && translated.trim().length > 0) {
                            return translated;
                        }
                    }
                } catch (e) {
                    console.error("Chyba primárního překladače, zkouším záložní...", e);
                }

                // Záložní rozhraní
                try {
                    const fallbackUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0, 450))}&langpair=autodetect|cs`;
                    const res = await fetch(fallbackUrl);
                    const data = await res.json();
                    if (data && data.responseData && data.responseData.translatedText) {
                        return data.responseData.translatedText;
                    }
                } catch (e) {
                    console.error("Záložní překlad selhal", e);
                }

                return text;
            };

            const processFile = (file) => {
                if (!file) return;

                stopSpeech();
                setIsLoading(true);
                setFileName(file.name);
                setStatusText(`Načítám: ${file.name}`);

                if (file.type.startsWith('image/')) {
                    Tesseract.recognize(file, 'ces+eng+spa+deu+fra').then(async result => {
                        const extracted = result.data.text.trim();
                        if (extracted.length > 0) {
                            setOriginalText(extracted);
                            const translated = await translateText(extracted);
                            setTranslatedText(translated);
                            setIsLoading(false);
                            setStatusText("Dokument úspěšně zpracován a přeložen!");
                            speakText(translateToCzech ? translated : extracted);
                        } else {
                            setIsLoading(false);
                            setOriginalText("Z fotky se nepodařilo přečíst žádný text.");
                            setTranslatedText("Z fotky se nepodařilo přečíst žádný text.");
                            setStatusText("Text nenalezen");
                        }
                    });
                } else {
                    const reader = new FileReader();
                    reader.onload = async (event) => {
                        const content = event.target.result;
                        if (content && content.trim().length > 0) {
                            setOriginalText(content);
                            const translated = await translateText(content);
                            setTranslatedText(translated);
                            setIsLoading(false);
                            setStatusText("Soubor úspěšně přeložen!");
                            speakText(translateToCzech ? translated : content);
                        } else {
                            setIsLoading(false);
                            setOriginalText("Soubor je prázdný.");
                            setTranslatedText("Soubor je prázdný.");
                            setStatusText("Prázdný soubor");
                        }
                    };
                    reader.onerror = () => {
                        setIsLoading(false);
                        setStatusText("Chyba při čtení souboru");
                    };
                    reader.readAsText(file, "UTF-8");
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    processFile(e.dataTransfer.files[0]);
                }
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
                setStatusText("Text zkopírován do schránky!");
            };

            return (
                <div className="w-full max-w-6xl mx-auto min-h-[92vh] flex flex-col justify-between space-y-6">
                    
                    {/* TOP HEADER */}
                    <header className="glass-panel p-4 sm:p-5 rounded-3xl flex flex-wrap justify-between items-center gap-4 glass-panel-glow">
                        <div className="flex items-center gap-3.5">
                            <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-400 to-indigo-500 text-black flex items-center justify-center font-black shadow-lg shadow-sky-500/20">
                                👁️
                            </div>
                            <div>
                                <h1 className="text-2xl font-extrabold font-heading tracking-tight bg-gradient-to-r from-white via-sky-100 to-sky-400 bg-clip-text text-transparent">
                                    SENTINEL
                                </h1>
                                <p className="text-xs text-sky-400 font-medium flex items-center gap-1.5 mt-0.5">
                                    <span className="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
                                    {statusText}
                                </p>
                            </div>
                        </div>

                        {/* OVLÁDACÍ TLAČÍTKA */}
                        <div className="flex items-center gap-2.5">
                            <button 
                                onClick={async () => {
                                    const nextState = !translateToCzech;
                                    setTranslateToCzech(nextState);
                                    if (originalText && !isLoading) {
                                        if (nextState && (!translatedText || translatedText === originalText)) {
                                            const newlyTranslated = await translateText(originalText);
                                            setTranslatedText(newlyTranslated);
                                            speakText(newlyTranslated);
                                        } else {
                                            speakText(nextState ? translatedText : originalText);
                                        }
                                    }
                                }}
                                className={`px-4 py-2.5 rounded-2xl font-semibold text-xs transition flex items-center gap-2 border ${
                                    translateToCzech 
                                        ? 'bg-sky-500/10 border-sky-400/40 text-sky-300 shadow-lg shadow-sky-500/10' 
                                        : 'bg-slate-800/60 border-slate-700 text-slate-400'
                                }`}
                            >
                                🌐 {translateToCzech ? 'Překlad do ČJ: ZAP' : 'Překlad: VYPNUT'}
                            </button>

                            <button 
                                onClick={() => setSpeechEnabled(!speechEnabled)}
                                className={`px-4 py-2.5 rounded-2xl font-semibold text-xs transition border ${
                                    speechEnabled 
                                        ? 'bg-emerald-500/10 border-emerald-400/40 text-emerald-400' 
                                        : 'bg-slate-800/60 border-slate-700 text-slate-500'
                                }`}
                            >
                                {speechEnabled ? '🔊 Hlas: ZAP' : '🔇 Hlas: VYP'}
                            </button>
                        </div>
                    </header>

                    {/* DRAG & DROP NAHRÁVACÍ ZÓNA */}
                    <section 
                        onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                        onDragLeave={() => setIsDragging(false)}
                        onDrop={handleDrop}
                        className={`glass-panel p-8 sm:p-10 rounded-3xl text-center border-2 border-dashed transition-all cursor-pointer relative overflow-hidden group ${
                            isDragging 
                                ? 'border-sky-400 bg-sky-500/10 scale-[0.99]' 
                                : 'border-slate-700 hover:border-sky-400/50 hover:bg-slate-800/40'
                        }`}
                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    >
                        <input 
                            type="file" 
                            ref={fileInputRef}
                            accept=".txt,.md,.json,.csv,.png,.jpg,.jpeg"
                            onChange={(e) => processFile(e.target.files[0])}
                            className="hidden"
                        />

                        <div className="flex flex-col items-center justify-center space-y-3">
                            <div className="w-16 h-16 rounded-2xl bg-slate-800/80 border border-slate-700 flex items-center justify-center text-sky-400 group-hover:scale-110 transition duration-300">
                                📂
                            </div>
                            <div>
                                <h2 className="text-lg font-bold font-heading text-white">
                                    Přetáhněte sem soubor neboli klikněte pro výběr
                                </h2>
                                <p className="text-xs text-slate-400 mt-1">
                                    Podporuje španělštinu, angličtinu, němčinu i další jazyky
                                </p>
                            </div>

                            {isLoading && (
                                <div className="mt-2 text-xs font-semibold text-sky-400 animate-pulse flex items-center gap-2">
                                    ⏳ Překládám text do češtiny...
                                </div>
                            )}
                        </div>
                    </section>

                    {/* DVOJICE TEXTOVÝCH PANELS */}
                    <main className="grid grid-cols-1 md:grid-cols-2 gap-5 flex-1">
                        
                        <div className="glass-panel rounded-3xl p-5 flex flex-col justify-between border border-slate-800">
                            <div className="space-y-3">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-2.5">
                                    <span className="text-xs font-semibold font-heading text-slate-400 flex items-center gap-2">
                                        📄 PŮVODNÍ OBSAH DOKUMENTU
                                    </span>
                                    {originalText && (
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); copyToClipboard(originalText); }}
                                            className="text-[11px] text-slate-400 hover:text-sky-400 font-medium transition"
                                        >
                                            📋 Zkopírovat
                                        </button>
                                    )}
                                </div>

                                <div className="h-60 overflow-y-auto custom-scrollbar bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80">
                                    <p className="text-xs sm:text-sm text-slate-300 font-normal leading-relaxed whitespace-pre-wrap">
                                        {originalText || 'Zde se zobrazí původní text...'}
                                    </p>
                                </div>
                            </div>

                            <div className="mt-3 pt-2 text-[11px] font-mono text-slate-500 flex justify-between">
                                <span>Slova: {originalText ? originalText.trim().split(/\s+/).length : 0}</span>
                                <span>Znaky: {originalText.length}</span>
                            </div>
                        </div>

                        <div className="glass-panel rounded-3xl p-5 flex flex-col justify-between border border-sky-500/30 glass-panel-glow">
                            <div className="space-y-3">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-2.5">
                                    <span className="text-xs font-semibold font-heading text-sky-400 flex items-center gap-2">
                                        🇨🇿 ČESKÝ PŘEKLAD (K HOTOVÉMU ČTENÍ)
                                    </span>
                                    {translatedText && (
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); copyToClipboard(translatedText); }}
                                            className="text-[11px] text-sky-400 hover:text-sky-300 font-medium transition"
                                        >
                                            📋 Zkopírovat
                                        </button>
                                    )}
                                </div>

                                <div className="h-60 overflow-y-auto custom-scrollbar bg-slate-950/80 p-4 rounded-2xl border border-sky-500/20">
                                    <p className="text-xs sm:text-sm text-sky-100 font-medium leading-relaxed whitespace-pre-wrap">
                                        {translatedText || 'Zde se zobrazí přeložený český text...'}
                                    </p>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-3 mt-4">
                                <button 
                                    onClick={() => speakText(translateToCzech ? translatedText : originalText)}
                                    disabled={isLoading || (!originalText && !translatedText)}
                                    className={`py-3 px-4 rounded-2xl font-extrabold text-xs transition flex items-center justify-center gap-2 shadow-lg ${
                                        isReading 
                                            ? 'bg-amber-400 text-black shadow-amber-500/20 animate-pulse' 
                                            : 'bg-gradient-to-r from-sky-400 to-blue-500 text-black hover:opacity-90 shadow-sky-500/20'
                                    }`}
                                >
                                    {isReading ? '🔄 ČTE SE HLASITĚ...' : '🔊 PŘEČÍST HLASITĚ'}
                                </button>

                                <button 
                                    onClick={stopSpeech}
                                    className="py-3 px-4 bg-rose-500/10 border border-rose-500/30 hover:bg-rose-500/20 text-rose-400 font-extrabold text-xs rounded-2xl transition flex items-center justify-center gap-2"
                                >
                                    ⏹️ ZASTAVIT ČTENÍ
                                </button>
                            </div>
                        </div>

                    </main>

                    <footer className="glass-panel p-3.5 rounded-2xl text-center text-xs text-slate-500 font-mono flex justify-between items-center px-6">
                        <span>SENTINEL 2026 // ACCESSIBILITY & OCR</span>
                        <span className="text-sky-400/80">MAIDAY SUSTAINABILITY PROJECT</span>
                    </footer>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

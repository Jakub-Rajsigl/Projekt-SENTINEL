<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENTINEL — Mobilní & Webový Asistent</title>

    <!-- PWA & Mobile Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts zaručující bezchybnou českou diakritiku -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
            user-select: none;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .accessible-card {
            background-color: #0f172a;
            border: 2px solid #38bdf8;
        }
        .accessible-btn-yellow {
            background-color: #facc15;
            color: #000000;
            font-weight: 800;
        }
        .accessible-btn-yellow:active {
            background-color: #ca8a04;
            transform: scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 sm:p-4">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SIMULATION_SCENES = {
            SPACE: {
                mode: "SPACE",
                title: "ORIENTACE V PROSTORU",
                description: "Před vámi ve vzdálenosti 1.5 metru se nachází dřevěná židle. Vlevo jsou otevřené dveře do chodby. Cesta přímo vpřed je volná.",
                warning: "POZOR: Za 2 metry vpravo leží na zemi kabel.",
                status: "BEZPEČNÁ CESTA VPŘED",
                statusColor: "text-emerald-400"
            },
            TEXT: {
                mode: "TEXT",
                title: "ČTENÍ Z KAMERY",
                description: "Nalezený text na ceduli: 'Restaurace U Zlatého Lva. Otevírací doba: Pondělí až Pátek 11:00 - 22:00. Dnes nabízíme polední menu.'",
                warning: null,
                status: "TEXT Z KAMERY PŘEČTEN",
                statusColor: "text-cyan-400"
            },
            OBJECT: {
                mode: "OBJECT",
                title: "HLEDÁNÍ OBJEKTŮ",
                description: "Hledaný objekt 'Klíče' byl zaměřen v pravé části zorného pole, vzdálenost přibližně 60 cm na stole.",
                warning: "ZVUKOVÉ NAVÁDĚNÍ AKTIVNÍ",
                status: "OBJEKT NALEZEN (98% SHODA)",
                statusColor: "text-yellow-400"
            },
            FILE: {
                mode: "FILE",
                title: "ČTENÍ NAHRANÉHO SOUBORU",
                description: "Vyberte textový soubor z telefonu nebo počítače. Aplikace přečte celý jeho obsah česky od začátku až do konce.",
                warning: null,
                status: "ČEKÁ SE NA SOUBOR",
                statusColor: "text-yellow-400"
            }
        };

        function App() {
            const [mode, setMode] = useState('SPACE');
            const [isSimulated, setIsSimulated] = useState(true);
            const [speechEnabled, setSpeechEnabled] = useState(true);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [isReadingFile, setIsReadingFile] = useState(false);
            const [currentOutput, setCurrentOutput] = useState(SIMULATION_SCENES.SPACE);
            const [uploadedFileName, setUploadedFileName] = useState('');
            const videoRef = useRef(null);
            const fileInputRef = useRef(null);

            // Zastavení mluvení
            const stopSpeech = () => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                setIsReadingFile(false);
            };

            // Český hlasový syntetizér s garancí fungování na mobilu
            const speakFullText = (text) => {
                if (!speechEnabled || !('speechSynthesis' in window) || !text) return;
                stopSpeech();
                setIsReadingFile(true);

                // Rozdělení textu na věty, aby mobilní prohlížeč nezablokoval dlouhý text
                const sentences = text
                    .split(/(?<=[.!?\n])\s+/)
                    .map(s => s.trim())
                    .filter(s => s.length > 0);

                if (sentences.length === 0) {
                    setIsReadingFile(false);
                    return;
                }

                sentences.forEach((sentence, index) => {
                    const utterance = new SpeechSynthesisUtterance(sentence);
                    utterance.lang = 'cs-CZ';
                    utterance.rate = 1.0;

                    if (index === sentences.length - 1) {
                        utterance.onend = () => setIsReadingFile(false);
                    }

                    window.speechSynthesis.speak(utterance);
                });
            };

            // Aktivace kamery na telefonu (zadní fotoaparát)
            useEffect(() => {
                if (!isSimulated && mode !== 'FILE' && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: { exact: "environment" } } 
                    })
                    .catch(() => {
                        // Fallback pro klasickou kameru / notebook
                        return navigator.mediaDevices.getUserMedia({ video: true });
                    })
                    .then(stream => {
                        if (videoRef.current) {
                            videoRef.current.srcObject = stream;
                        }
                    })
                    .catch(err => {
                        setIsSimulated(true);
                        speakFullText("Kamera nebyla nalezena. Přepínám do simulačního režimu.");
                    });
                }
            }, [isSimulated, mode]);

            // Přepnutí režimu
            const changeMode = (newMode) => {
                stopSpeech();
                setMode(newMode);
                const scene = SIMULATION_SCENES[newMode];
                setCurrentOutput(scene);

                let names = {
                    SPACE: "Orientace v prostoru",
                    TEXT: "Čtení z kamery",
                    OBJECT: "Hledání objektů",
                    FILE: "Čtení souborů"
                };

                speakFullText(`Aktivován režim: ${names[newMode]}. ${scene.description}`);
            };

            // Ruční skenování
            const runAnalysis = () => {
                setIsAnalyzing(true);
                speakFullText("Probíhá skenování okolí...");

                setTimeout(() => {
                    setIsAnalyzing(false);
                    const scene = SIMULATION_SCENES[mode];
                    setCurrentOutput(scene);
                    speakFullText(`${scene.description} ${scene.warning ? scene.warning : ''}`);
                }, 1200);
            };

            // Nahrání souboru z mobilu / PC
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setUploadedFileName(file.name);
                setIsAnalyzing(true);
                stopSpeech();

                const reader = new FileReader();
                reader.onload = (event) => {
                    const content = event.target.result;
                    setIsAnalyzing(false);

                    const fileOutput = {
                        mode: "FILE",
                        title: `SOUBOR: ${file.name}`,
                        description: content || "Soubor je prázdný.",
                        warning: null,
                        status: "SOUBOR NAČTEN",
                        statusColor: "text-emerald-400"
                    };

                    setCurrentOutput(fileOutput);
                    speakFullText(content);
                };

                reader.onerror = () => {
                    setIsAnalyzing(false);
                    speakFullText("Chyba při čtení souboru.");
                };

                reader.readAsText(file);
            };

            return (
                <div className="w-full max-w-5xl mx-auto min-h-screen flex flex-col justify-between space-y-4">
                    
                    {/* Mobilní Hlavička */}
                    <header className="accessible-card p-3 sm:p-4 rounded-2xl flex justify-between items-center gap-2">
                        <div className="flex items-center gap-2">
                            <div className="w-10 h-10 rounded-xl bg-yellow-400 text-black flex items-center justify-center font-black text-xl shrink-0">
                                👁️
                            </div>
                            <div>
                                <h1 className="text-xl font-black text-white leading-tight">SENTINEL</h1>
                                <p className="text-[10px] text-yellow-400 font-mono">VISION & FILE ASSISTANT</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <button 
                                onClick={() => {
                                    const next = !speechEnabled;
                                    setSpeechEnabled(next);
                                    if (!next) stopSpeech();
                                    else speakFullText("Hlas zapnut.");
                                }}
                                className={`px-3 py-2 rounded-xl font-bold text-xs transition ${
                                    speechEnabled ? 'bg-emerald-500 text-black' : 'bg-gray-800 text-gray-400'
                                }`}
                            >
                                {speechEnabled ? '🔊 HLAS' : 'MOČ HLAS'}
                            </button>

                            {mode !== 'FILE' && (
                                <button 
                                    onClick={() => {
                                        const next = !isSimulated;
                                        setIsSimulated(next);
                                        speakFullText(next ? "Simulace." : "Živá kamera.");
                                    }}
                                    className="px-3 py-2 rounded-xl bg-sky-600 text-white font-bold text-xs"
                                >
                                    {isSimulated ? '🎮 SIM' : '📷 CAM'}
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Mobilní Mřížka Tlačítek Režimů */}
                    <nav className="grid grid-cols-2 md:grid-cols-4 gap-2">
                        <button 
                            onClick={() => changeMode('SPACE')}
                            className={`p-3 rounded-2xl text-left border-2 transition flex flex-col justify-between h-28 ${
                                mode === 'SPACE' ? 'bg-yellow-400 text-black border-white shadow-lg' : 'bg-gray-900 text-white border-gray-800'
                            }`}
                        >
                            <span className="text-2xl">🚶</span>
                            <div>
                                <span className="block font-black text-xs">ORIENTACE</span>
                                <span className="text-[9px] font-semibold opacity-80">Překážky</span>
                            </div>
                        </button>

                        <button 
                            onClick={() => changeMode('TEXT')}
                            className={`p-3 rounded-2xl text-left border-2 transition flex flex-col justify-between h-28 ${
                                mode === 'TEXT' ? 'bg-yellow-400 text-black border-white shadow-lg' : 'bg-gray-900 text-white border-gray-800'
                            }`}
                        >
                            <span className="text-2xl">📖</span>
                            <div>
                                <span className="block font-black text-xs">KAMERA TEXT</span>
                                <span className="text-[9px] font-semibold opacity-80">Cedule</span>
                            </div>
                        </button>

                        <button 
                            onClick={() => changeMode('OBJECT')}
                            className={`p-3 rounded-2xl text-left border-2 transition flex flex-col justify-between h-28 ${
                                mode === 'OBJECT' ? 'bg-yellow-400 text-black border-white shadow-lg' : 'bg-gray-900 text-white border-gray-800'
                            }`}
                        >
                            <span className="text-2xl">🔍</span>
                            <div>
                                <span className="block font-black text-xs">OBJEKTY</span>
                                <span className="text-[9px] font-semibold opacity-80">Klíče, atd.</span>
                            </div>
                        </button>

                        <button 
                            onClick={() => changeMode('FILE')}
                            className={`p-3 rounded-2xl text-left border-2 transition flex flex-col justify-between h-28 ${
                                mode === 'FILE' ? 'bg-yellow-400 text-black border-white shadow-lg' : 'bg-gray-900 text-white border-gray-800'
                            }`}
                        >
                            <span className="text-2xl">📂</span>
                            <div>
                                <span className="block font-black text-xs">SOUBORY</span>
                                <span className="text-[9px] font-semibold opacity-80">Čtení .txt</span>
                            </div>
                        </button>
                    </nav>

                    {/* Hlavní Obrazovka */}
                    <main className="grid grid-cols-1 lg:grid-cols-2 gap-4 flex-1">
                        
                        {/* Levý panel: Video / Soubor */}
                        <div className="accessible-card rounded-2xl p-4 flex flex-col justify-between relative overflow-hidden min-h-[240px]">
                            {mode === 'FILE' ? (
                                <div className="space-y-3 text-center my-auto p-2">
                                    <div className="text-4xl">📁</div>
                                    <h3 className="text-base font-bold text-white">VYBERTE SOUBOR K PŘEČTENÍ</h3>
                                    
                                    <input 
                                        type="file" 
                                        ref={fileInputRef}
                                        accept=".txt,.md,.json,.log,.csv"
                                        onChange={handleFileUpload}
                                        className="hidden"
                                    />

                                    <button 
                                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                        className="py-3.5 px-4 accessible-btn-yellow rounded-xl text-xs font-black transition w-full"
                                    >
                                        📂 VYBRAT SOUBOR Z TELEFONU / PC
                                    </button>

                                    {uploadedFileName && (
                                        <div className="text-[10px] font-mono text-cyan-400 pt-1">
                                            Soubor: <strong>{uploadedFileName}</strong>
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="flex flex-col justify-between h-full space-y-3">
                                    <div className="flex justify-between items-center text-[10px] font-mono">
                                        <span className="font-bold text-sky-400">
                                            {isSimulated ? 'VIRTUAL KAMERA' : 'ŽIVÁ KAMERA'}
                                        </span>
                                        <span className="px-2 py-0.5 rounded bg-red-600 text-white font-bold animate-pulse">
                                            LIVE
                                        </span>
                                    </div>

                                    {isSimulated ? (
                                        <div className="w-full h-40 bg-slate-900 rounded-xl border-2 border-dashed border-sky-500/50 flex flex-col items-center justify-center p-3 text-center">
                                            <span className="text-3xl mb-1">
                                                {mode === 'SPACE' ? '🚪' : mode === 'TEXT' ? '📜' : '🔑'}
                                            </span>
                                            <p className="text-xs font-bold text-white">
                                                {currentOutput.title}
                                            </p>
                                        </div>
                                    ) : (
                                        <video 
                                            ref={videoRef} 
                                            autoPlay 
                                            playsInline 
                                            className="w-full h-40 object-cover rounded-xl border-2 border-sky-400"
                                        />
                                    )}

                                    <button 
                                        onClick={runAnalysis}
                                        disabled={isAnalyzing}
                                        className="w-full py-3 accessible-btn-yellow rounded-xl text-xs font-black"
                                    >
                                        {isAnalyzing ? '⏳ ANALYZUJI...' : '📸 SKENOVAT SCÉNU'}
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Pravý panel: Výstup a Hlasový Text */}
                        <div className="accessible-card rounded-2xl p-4 flex flex-col justify-between border-2 border-yellow-400">
                            <div className="space-y-3">
                                <div className="border-b border-gray-800 pb-2 flex justify-between items-center text-[10px] font-mono">
                                    <span className="text-yellow-400 font-bold">HLASOVÝ VÝSTUP</span>
                                    <span className={`font-bold ${currentOutput.statusColor}`}>
                                        {currentOutput.status}
                                    </span>
                                </div>

                                <div className="space-y-1">
                                    <h2 className="text-lg font-extrabold text-white">
                                        {currentOutput.title}
                                    </h2>
                                    <div className="max-h-44 overflow-y-auto bg-black/60 p-3 rounded-xl border border-gray-800">
                                        <p className="text-xs sm:text-sm text-gray-100 font-medium leading-relaxed whitespace-pre-wrap">
                                            {currentOutput.description}
                                        </p>
                                    </div>
                                </div>

                                {currentOutput.warning && (
                                    <div className="p-2.5 rounded-xl bg-red-950/80 border-2 border-red-500 text-red-200 font-bold text-[11px] flex items-center gap-2">
                                        <span>⚠️</span>
                                        <span>{currentOutput.warning}</span>
                                    </div>
                                )}
                            </div>

                            {/* Tlačítka Řeči */}
                            <div className="grid grid-cols-2 gap-2 mt-3">
                                <button 
                                    onClick={() => speakFullText(`${currentOutput.description} ${currentOutput.warning ? currentOutput.warning : ''}`)}
                                    className="py-2.5 bg-sky-600 active:bg-sky-500 text-white font-extrabold text-xs rounded-xl"
                                >
                                    {isReadingFile ? '🔄 ČTE SE...' : '🔊 ZNOVU'}
                                </button>
                                <button 
                                    onClick={stopSpeech}
                                    className="py-2.5 bg-red-600 active:bg-red-500 text-white font-extrabold text-xs rounded-xl"
                                >
                                    ⏹️ ZASTAVIT
                                </button>
                            </div>
                        </div>

                    </main>

                    {/* Zápatí */}
                    <footer className="accessible-card p-2.5 rounded-2xl text-center text-[10px] font-mono text-gray-400">
                        SENTINEL 2026 // MAIDAY 2026 ASSISTANT
                    </footer>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

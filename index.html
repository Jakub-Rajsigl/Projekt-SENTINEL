<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENTINEL — Real Vision & Text Reader</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tesseract.js pro reálné OCR čtení textu z kamery/fotek -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body { font-family: 'Outfit', sans-serif; background-color: #000000; color: #ffffff; overflow-x: hidden; user-select: none; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .accessible-card { background-color: #0f172a; border: 2px solid #38bdf8; }
        .accessible-btn-yellow { background-color: #facc15; color: #000000; font-weight: 800; }
        .accessible-btn-yellow:active { background-color: #ca8a04; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 sm:p-4">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [mode, setMode] = useState('CAMERA'); // CAMERA, FILE
            const [speechEnabled, setSpeechEnabled] = useState(true);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [isReading, setIsReading] = useState(false);
            const [scannedText, setScannedText] = useState('Naměřte kameru na text nebo značku a stiskněte tlačítko SKENOVAT.');
            const [statusText, setStatusText] = useState('Připraven k použití');
            const [cameraActive, setCameraActive] = useState(false);

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);

            // Stop speech
            const stopSpeech = () => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                setIsReading(false);
            };

            // Přečtení textu
            const speakText = (text) => {
                if (!speechEnabled || !('speechSynthesis' in window) || !text) return;
                stopSpeech();
                setIsReading(true);

                const sentences = text
                    .split(/(?<=[.!?\n])\s+/)
                    .map(s => s.trim())
                    .filter(s => s.length > 0);

                if (sentences.length === 0) {
                    setIsReading(false);
                    return;
                }

                sentences.forEach((sentence, index) => {
                    const utterance = new SpeechSynthesisUtterance(sentence);
                    utterance.lang = 'cs-CZ';
                    utterance.rate = 1.0;

                    if (index === sentences.length - 1) {
                        utterance.onend = () => setIsReading(false);
                    }

                    window.speechSynthesis.speak(utterance);
                });
            };

            // Aktivace kamery mobilu
            const startCamera = () => {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: { ideal: "environment" } } 
                    })
                    .then(stream => {
                        if (videoRef.current) {
                            videoRef.current.srcObject = stream;
                            setCameraActive(true);
                        }
                    })
                    .catch(err => {
                        console.error("Kamera nedostupná", err);
                        setStatusText("Kamera nedostupná - povolte přístup");
                        setCameraActive(false);
                    });
                }
            };

            useEffect(() => {
                if (mode === 'CAMERA') {
                    startCamera();
                }
            }, [mode]);

            // SKUTEČNÉ SKENOVÁNÍ Z KAMERY
            const scanCameraText = async () => {
                if (!videoRef.current || isAnalyzing) return;

                setIsAnalyzing(true);
                setStatusText("Skenuji obraz z kamery...");
                speakText("Probíhá skenování textu...");

                const video = videoRef.current;
                const canvas = canvasRef.current;
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                try {
                    // Tesseract OCR rozpoznávání textu z fotky
                    const result = await Tesseract.recognize(canvas, 'ces+eng');
                    const foundText = result.data.text.trim();

                    setIsAnalyzing(false);
                    if (foundText.length > 2) {
                        setScannedText(foundText);
                        setStatusText("Text úspešně naskenován!");
                        speakText(`Naskenovaný text: ${foundText}`);
                    } else {
                        setScannedText("Nebyly nalezeny žádné čitelné nápisy. Zkuste přiblížit nebo lépe posvítit.");
                        setStatusText("Nenalezen žádný text");
                        speakText("Na snímku se nepodařilo přečíst žádný text.");
                    }
                } catch (e) {
                    setIsAnalyzing(false);
                    setStatusText("Chyba při skenování");
                    speakText("Chyba při zpracování obrazu.");
                }
            };

            // SKUTEČNÉ ČTENÍ ZE SOUBORU (.txt, .md, fotka)
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsAnalyzing(true);
                stopSpeech();
                setStatusText(`Nahrávám: ${file.name}`);

                // Pokud jde o fotku
                if (file.type.startsWith('image/')) {
                    speakText("Zpracovávám text z obrázku...");
                    Tesseract.recognize(file, 'ces+eng').then(result => {
                        setIsAnalyzing(false);
                        const text = result.data.text.trim();
                        if (text) {
                            setScannedText(text);
                            speakText(`Text z fotky: ${text}`);
                        } else {
                            setScannedText("Z fotky se nepodařilo přečíst text.");
                            speakText("Z fotky se nepodařilo přečíst text.");
                        }
                    });
                } else {
                    // Pokud jde o textový soubor
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setIsAnalyzing(false);
                        const text = event.target.result;
                        setScannedText(text || "Soubor je prázdný.");
                        setStatusText("Soubor načten");
                        speakText(text);
                    };
                    reader.readAsText(file);
                }
            };

            return (
                <div className="w-full max-w-4xl mx-auto min-h-screen flex flex-col justify-between space-y-4">
                    
                    {/* Skrytý canvas pro zachycení fotky */}
                    <canvas ref={canvasRef} className="hidden"></canvas>

                    {/* Hlavička */}
                    <header className="accessible-card p-3 rounded-2xl flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-10 h-10 rounded-xl bg-yellow-400 text-black flex items-center justify-center font-black text-xl">
                                👁️
                            </div>
                            <div>
                                <h1 className="text-xl font-black text-white leading-tight">SENTINEL REAL-OCR</h1>
                                <p className="text-[10px] text-yellow-400 font-mono">{statusText}</p>
                            </div>
                        </div>

                        <button 
                            onClick={() => setSpeechEnabled(!speechEnabled)}
                            className={`px-3 py-2 rounded-xl font-bold text-xs ${speechEnabled ? 'bg-emerald-500 text-black' : 'bg-gray-800 text-gray-400'}`}
                        >
                            {speechEnabled ? '🔊 HLAS ZAP' : '🔇 HLAS VYP'}
                        </button>
                    </header>

                    {/* Přepínač Kamera vs Soubor */}
                    <div className="grid grid-cols-2 gap-2">
                        <button 
                            onClick={() => { stopSpeech(); setMode('CAMERA'); }}
                            className={`p-3 rounded-xl font-bold text-xs border-2 ${mode === 'CAMERA' ? 'bg-yellow-400 text-black border-white' : 'bg-gray-900 text-white border-gray-800'}`}
                        >
                            📷 SKENOVAT KAMEROU
                        </button>
                        <button 
                            onClick={() => { stopSpeech(); setMode('FILE'); }}
                            className={`p-3 rounded-xl font-bold text-xs border-2 ${mode === 'FILE' ? 'bg-yellow-400 text-black border-white' : 'bg-gray-900 text-white border-gray-800'}`}
                        >
                            📂 NAHRÁT SOUBOR / FOTKU
                        </button>
                    </div>

                    {/* Hlavní okno */}
                    <main className="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">
                        
                        {/* Vstupní oblast */}
                        <div className="accessible-card rounded-2xl p-4 flex flex-col justify-between min-h-[250px]">
                            {mode === 'CAMERA' ? (
                                <div className="flex flex-col justify-between h-full space-y-3">
                                    <div className="relative rounded-xl overflow-hidden bg-slate-900 h-48 border border-sky-400">
                                        <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover" />
                                    </div>

                                    <button 
                                        onClick={scanCameraText}
                                        disabled={isAnalyzing}
                                        className="w-full py-3.5 accessible-btn-yellow rounded-xl text-xs font-black shadow-lg"
                                    >
                                        {isAnalyzing ? '⏳ REÁLNĚ SKENUJI TEXT...' : '📸 NASKENOVAT A PŘEČÍST REALITU'}
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-4 text-center my-auto p-2">
                                    <div className="text-4xl">📄</div>
                                    <h3 className="text-sm font-bold text-white">VYBERTE SOUBOR NEBO FOTKU</h3>
                                    
                                    <input 
                                        type="file" 
                                        ref={fileInputRef}
                                        accept=".txt,.md,.json,.png,.jpg,.jpeg"
                                        onChange={handleFileUpload}
                                        className="hidden"
                                    />

                                    <button 
                                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                        className="py-3.5 px-4 accessible-btn-yellow rounded-xl text-xs font-black transition w-full"
                                    >
                                        📂 VYBRAT FOTKU NEBO TEXT Z ZAŘÍZENÍ
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Výstupní text a hlas */}
                        <div className="accessible-card rounded-2xl p-4 flex flex-col justify-between border-2 border-yellow-400">
                            <div className="space-y-2">
                                <span className="text-[10px] font-mono text-yellow-400 font-bold block border-b border-gray-800 pb-1">
                                    NASKENOVANÝ OBSAH:
                                </span>
                                <div className="h-44 overflow-y-auto bg-black/70 p-3 rounded-xl border border-gray-800">
                                    <p className="text-xs text-gray-100 font-medium leading-relaxed whitespace-pre-wrap">
                                        {scannedText}
                                    </p>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-2 mt-3">
                                <button 
                                    onClick={() => speakText(scannedText)}
                                    className="py-2.5 bg-sky-600 text-white font-extrabold text-xs rounded-xl"
                                >
                                    {isReading ? '🔄 ČTE SE...' : '🔊 PŘEČÍST ZNOVU'}
                                </button>
                                <button 
                                    onClick={stopSpeech}
                                    className="py-2.5 bg-red-600 text-white font-extrabold text-xs rounded-xl"
                                >
                                    ⏹️ ZASTAVIT
                                </button>
                            </div>
                        </div>

                    </main>

                    <footer className="accessible-card p-2 rounded-2xl text-center text-[10px] font-mono text-gray-400">
                        SENTINEL 2026 // REAL-TIME OCR VISION
                    </footer>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

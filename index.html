<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENTINEL — Accurate Real-Time OCR</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tesseract.js OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body { font-family: 'Outfit', sans-serif; background-color: #000000; color: #ffffff; overflow-x: hidden; user-select: none; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .accessible-card { background-color: #0f172a; border: 2px solid #38bdf8; }
        .accessible-btn-yellow { background-color: #facc15; color: #000000; font-weight: 800; }
        .accessible-btn-yellow:active { background-color: #ca8a04; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 sm:p-4">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [mode, setMode] = useState('CAMERA');
            const [speechEnabled, setSpeechEnabled] = useState(true);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [isReading, setIsReading] = useState(false);
            const [scannedText, setScannedText] = useState('Namiřte kameru přesně na text a stiskněte žluté tlačítko.');
            const [statusText, setStatusText] = useState('Připraven');
            
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);

            const stopSpeech = () => {
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                setIsReading(false);
            };

            const speakText = (text) => {
                if (!speechEnabled || !('speechSynthesis' in window) || !text) return;
                stopSpeech();
                setIsReading(true);

                const sentences = text
                    .split(/(?<=[.!?\n])\s+/)
                    .map(s => s.trim())
                    .filter(s => s.length > 0);

                if (sentences.length === 0) {
                    setIsReading(false);
                    return;
                }

                sentences.forEach((sentence, index) => {
                    const utterance = new SpeechSynthesisUtterance(sentence);
                    utterance.lang = 'cs-CZ';
                    utterance.rate = 1.0;

                    if (index === sentences.length - 1) {
                        utterance.onend = () => setIsReading(false);
                    }

                    window.speechSynthesis.speak(utterance);
                });
            };

            // Aktivace celé mobilní kamery
            useEffect(() => {
                if (mode === 'CAMERA' && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: { ideal: "environment" },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        } 
                    })
                    .then(stream => {
                        if (videoRef.current) {
                            videoRef.current.srcObject = stream;
                        }
                    })
                    .catch(err => {
                        setStatusText("Chyba kamery");
                    });
                }
            }, [mode]);

            // Vyčištění nesmyslných znaků z OCR výstupu
            const cleanText = (rawText) => {
                return rawText
                    .split('\n')
                    .map(line => line.trim())
                    .filter(line => {
                        // Odstranit řádky, které obsahují jen náhodné šumy a divné znaky
                        const validChars = line.replace(/[^a-zA-AáeíóúůýčďěňřšťžÁÉÍÓÚŮÝČĎĚŇŘŠŤŽ0-9\s]/g, '');
                        return validChars.length > 2;
                    })
                    .join('\n')
                    .replace(/\s+/g, ' ');
            };

            // Úprava fotky pro vysokou přesnost (Zvýšení kontrastu)
            const preprocessImage = (canvas, ctx, video) => {
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;

                // Vykreslení
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Černobílý filtr & úprava kontrastu pro čisté čtení
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;

                for (let i = 0; i < data.length; i += 4) {
                    const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    // Prahování - převede na ostrý text bez stínů
                    const threshold = avg > 110 ? 255 : 0;
                    data[i] = threshold;
                    data[i + 1] = threshold;
                    data[i + 2] = threshold;
                }

                ctx.putImageData(imageData, 0, 0);
            };

            // Skenování z kamery
            const scanCameraText = async () => {
                if (!videoRef.current || isAnalyzing) return;

                setIsAnalyzing(true);
                setStatusText("Zpracovávám obraz...");
                speakText("Skenuji text...");

                const video = videoRef.current;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');

                // Úprava obrazu
                preprocessImage(canvas, ctx, video);

                try {
                    const result = await Tesseract.recognize(canvas, 'ces+eng', {
                        tessedit_char_whitelist: '0123456789aábcčdďeéěfghiíjklmnňoópqrřsštťuúůvwxyýzžAÁBCČDĎEÉĚFGHIÍJKLMNŇOÓPQRŘSŠTŤUÚŮVWXYÝZŽ.,!?:- '
                    });
                    
                    const cleaned = cleanText(result.data.text);

                    setIsAnalyzing(false);
                    if (cleaned.length > 2) {
                        setScannedText(cleaned);
                        setStatusText("Naskenováno přesně");
                        speakText(cleaned);
                    } else {
                        setScannedText("Text nebyl rozpoznán. Zkuste podržet telefon v klidu a namířit blíž na nápis.");
                        setStatusText("Nenalezen čistý text");
                        speakText("Text se nepodařilo přečíst. Zkuste namířit blíž.");
                    }
                } catch (e) {
                    setIsAnalyzing(false);
                    setStatusText("Chyba čtení");
                }
            };

            // Nahrání ze souboru / fotky
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsAnalyzing(true);
                stopSpeech();

                if (file.type.startsWith('image/')) {
                    speakText("Zpracovávám obrázek...");
                    Tesseract.recognize(file, 'ces+eng').then(result => {
                        setIsAnalyzing(false);
                        const cleaned = cleanText(result.data.text);
                        if (cleaned) {
                            setScannedText(cleaned);
                            speakText(cleaned);
                        } else {
                            setScannedText("Nepodařilo se přečíst text z fotky.");
                        }
                    });
                } else {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setIsAnalyzing(false);
                        const text = event.target.result;
                        setScannedText(text || "Soubor je prázdný.");
                        speakText(text);
                    };
                    reader.readAsText(file);
                }
            };

            return (
                <div className="w-full max-w-4xl mx-auto min-h-screen flex flex-col justify-between space-y-4">
                    
                    <canvas ref={canvasRef} className="hidden"></canvas>

                    {/* Hlavička */}
                    <header className="accessible-card p-3 rounded-2xl flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-10 h-10 rounded-xl bg-yellow-400 text-black flex items-center justify-center font-black text-xl">
                                👁️
                            </div>
                            <div>
                                <h1 className="text-xl font-black text-white leading-tight">SENTINEL OCR</h1>
                                <p className="text-[10px] text-yellow-400 font-mono">{statusText}</p>
                            </div>
                        </div>

                        <button 
                            onClick={() => setSpeechEnabled(!speechEnabled)}
                            className={`px-3 py-2 rounded-xl font-bold text-xs ${speechEnabled ? 'bg-emerald-500 text-black' : 'bg-gray-800 text-gray-400'}`}
                        >
                            {speechEnabled ? '🔊 HLAS ZAP' : '🔇 HLAS VYP'}
                        </button>
                    </header>

                    {/* Přepínač Kamera vs Soubor */}
                    <div className="grid grid-cols-2 gap-2">
                        <button 
                            onClick={() => { stopSpeech(); setMode('CAMERA'); }}
                            className={`p-3 rounded-xl font-bold text-xs border-2 ${mode === 'CAMERA' ? 'bg-yellow-400 text-black border-white' : 'bg-gray-900 text-white border-gray-800'}`}
                        >
                            📷 SKENOVAT KAMEROU
                        </button>
                        <button 
                            onClick={() => { stopSpeech(); setMode('FILE'); }}
                            className={`p-3 rounded-xl font-bold text-xs border-2 ${mode === 'FILE' ? 'bg-yellow-400 text-black border-white' : 'bg-gray-900 text-white border-gray-800'}`}
                        >
                            📂 NAHRÁT FOTKU / SOUBOR
                        </button>
                    </div>

                    {/* Hlavní okno */}
                    <main className="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">
                        
                        {/* Kamera okno */}
                        <div className="accessible-card rounded-2xl p-3 flex flex-col justify-between min-h-[250px]">
                            {mode === 'CAMERA' ? (
                                <div className="flex flex-col justify-between h-full space-y-3">
                                    {/* Zobrazení celého neorezaného záběru */}
                                    <div className="relative rounded-xl overflow-hidden bg-black h-52 border border-sky-400 flex items-center justify-center">
                                        <video 
                                            ref={videoRef} 
                                            autoPlay 
                                            playsInline 
                                            className="w-full h-full object-contain" 
                                        />
                                    </div>

                                    <button 
                                        onClick={scanCameraText}
                                        disabled={isAnalyzing}
                                        className="w-full py-3.5 accessible-btn-yellow rounded-xl text-xs font-black shadow-lg"
                                    >
                                        {isAnalyzing ? '⏳ ANALYZUJI KONTRAST...' : '📸 PŘEČÍST TEXT Z KAMERY'}
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-4 text-center my-auto p-2">
                                    <div className="text-4xl">📄</div>
                                    <h3 className="text-sm font-bold text-white">VYBERTE SOUBOR NEBO FOTKU</h3>
                                    
                                    <input 
                                        type="file" 
                                        ref={fileInputRef}
                                        accept=".txt,.md,.json,.png,.jpg,.jpeg"
                                        onChange={handleFileUpload}
                                        className="hidden"
                                    />

                                    <button 
                                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                        className="py-3.5 px-4 accessible-btn-yellow rounded-xl text-xs font-black transition w-full"
                                    >
                                        📂 VYBRAT SOUBOR NEBO FOTKU
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Výstupní text */}
                        <div className="accessible-card rounded-2xl p-4 flex flex-col justify-between border-2 border-yellow-400">
                            <div className="space-y-2">
                                <span className="text-[10px] font-mono text-yellow-400 font-bold block border-b border-gray-800 pb-1">
                                    PŘEČTENÝ TEXT:
                                </span>
                                <div className="h-44 overflow-y-auto bg-black/80 p-3 rounded-xl border border-gray-800">
                                    <p className="text-xs text-gray-100 font-medium leading-relaxed whitespace-pre-wrap">
                                        {scannedText}
                                    </p>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-2 mt-3">
                                <button 
                                    onClick={() => speakText(scannedText)}
                                    className="py-2.5 bg-sky-600 text-white font-extrabold text-xs rounded-xl"
                                >
                                    {isReading ? '🔄 ČTE SE...' : '🔊 PŘEČÍST ZNOVU'}
                                </button>
                                <button 
                                    onClick={stopSpeech}
                                    className="py-2.5 bg-red-600 text-white font-extrabold text-xs rounded-xl"
                                >
                                    ⏹️ ZASTAVIT
                                </button>
                            </div>
                        </div>

                    </main>

                    <footer className="accessible-card p-2 rounded-2xl text-center text-[10px] font-mono text-gray-400">
                        SENTINEL 2026 // CLEAN ACCURATE OCR
                    </footer>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
